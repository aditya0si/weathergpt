name: WeatherGPT CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint, Pytest & Evals (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ evals/ scripts/

      - name: Run Pytest Suite
        run: |
          pytest -v --cov=weathergpt --cov-report=term-missing

      - name: Run 50-Item Benchmark Evaluation Suite
        run: |
          python evals/run_evals.py

      - name: Verify LoRA Fine-Tuning Script Dry-Run
        run: |
          python scripts/train_indic_lora.py --synthetic-dry-run --epochs 1

  frontend-build:
    name: Frontend Lint & Build (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Vite static bundle
        working-directory: frontend
        run: npm run build
