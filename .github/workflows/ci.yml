name: WeatherGPT CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint, Pytest & Benchmark Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both Python legs must report their own result; a failure in one leg must
      # not cancel the other (the cancelled 3.11 leg previously hid its status).
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ evals/ scripts/

      - name: Run Pytest Suite
        run: |
          pytest -v --cov=weathergpt --cov-report=term-missing

      # Real gate: exits non-zero if overall correctness drops below the floor.
      # Results are written to a scratch path so CI does not rewrite the
      # committed evals/RESULTS.md snapshot. The harness prints the data
      # provenance (live upstream vs synthetic fallback) for the run.
      - name: "Benchmark harness (50 cases, gate: overall correctness >= 85%)"
        run: |
          python evals/run_evals.py --fail-under 85 --output "$RUNNER_TEMP/benchmark_results.md"
          cat "$RUNNER_TEMP/benchmark_results.md"

      # Smoke test only: generates the synthetic corpus and LoRA adapter config.
      # No training and no metrics are produced (see scripts/train_indic_lora.py).
      - name: LoRA pipeline dry-run smoke test (no training performed)
        run: |
          python scripts/train_indic_lora.py --synthetic-dry-run --epochs 1 --output-dir "$RUNNER_TEMP/indic-lora-dry-run"

  frontend-build:
    name: Frontend Build (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # No npm fallback: package-lock.json is committed and must stay installable.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite static bundle
        working-directory: frontend
        run: npm run build
