[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weathergpt"
version = "1.0.0"
description = "Indic Multilingual Conversational AI Weather Platform (IMD / Open-Meteo / GFS / AgroMet / Climate Q&A)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SIH26068 WeatherGPT Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]
evals = [
    "tqdm>=4.66.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "peft>=0.9.0",
    "accelerate>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

